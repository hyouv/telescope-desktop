# Telescope: check that the CI secrets are well-formed and work, without printing them.
name: Telescope check secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      API_ID: ${{ secrets.TELESCOPE_API_ID }}
      API_HASH: ${{ secrets.TELESCOPE_API_HASH }}
      UPDATE_KEY: ${{ secrets.TELESCOPE_UPDATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Telegram/Resources/update_telescope

      - name: Telegram API credentials
        if: always()
        run: |
          [[ "$API_ID" =~ ^[0-9]+$ ]] && echo "TELESCOPE_API_ID: ok (${#API_ID} digits)" || { echo "::error::TELESCOPE_API_ID is not a number"; exit 1; }
          [[ "$API_HASH" =~ ^[0-9a-f]{32}$ ]] && echo "TELESCOPE_API_HASH: ok" || { echo "::error::TELESCOPE_API_HASH is not 32 hex characters"; exit 1; }

      - name: Update signing key matches the manifest
        if: always()
        run: |
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/k.pem"
          x=$(openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -outform DER 2>/dev/null | tail -c 32 | base64 | tr '+/' '-_' | tr -d '=')
          rm -f "$RUNNER_TEMP/k.pem"
          [ -n "$x" ] || { echo "::error::TELESCOPE_UPDATE_KEY is not a valid Ed25519 private key"; exit 1; }
          want=$(jq -r '.keys[] | select(.id=="tl-2026a") | .x' Telegram/Resources/update_telescope/manifest.min.json)
          [ "$x" = "$want" ] && echo "TELESCOPE_UPDATE_KEY: ok (matches tl-2026a)" || { echo "::error::TELESCOPE_UPDATE_KEY doesn't match key tl-2026a in the manifest"; exit 1; }

      - name: Cloudflare R2 write and read
        if: always()
        run: |
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not 32 hex characters"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          stamp=$(date -u +%FT%TZ)-$RANDOM; echo "$stamp" > ping.txt
          w="npx -y wrangler@4 r2 object"
          $w put telescope-dl/desktop/ci-ping.txt --file ping.txt --remote --cache-control no-cache > /dev/null
          sleep 3
          got=$(curl -fsS "https://dl.hyv.moe/desktop/ci-ping.txt?$RANDOM")
          $w delete telescope-dl/desktop/ci-ping.txt --remote > /dev/null
          [ "$got" = "$stamp" ] && echo "Cloudflare: ok (wrote, read back through dl.hyv.moe, deleted)" || { echo "::error::wrote to R2 but dl.hyv.moe returned something else"; exit 1; }
